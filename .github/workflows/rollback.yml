
name: Manual Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Enter the previous working commit ID"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Previous Working Version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Previous Version
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Previous Version
        id: deployment
        uses: actions/deploy-pages@v4
